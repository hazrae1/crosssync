// CrossSync / Counter-Strike 2 configuration profile
sensitivity "1.6"

// Crosshair
cl_crosshaircolor_r "50"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "160"
cl_crosshair_length "8"
cl_crosshair_gap "4"
cl_crosshair_thickness "2"

// Viewmodel: parametros del modelo del arma en CS2
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "2"
viewmodel_offset_z "-2"

// Controls
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "SPACE" "+jump"
bind "SHIFT" "+sprint"
bind "CTRL" "+duck"
bind "F5" "buy ak47"
bind "F6" "buy awp"

echo "crosssync configuration loaded"
