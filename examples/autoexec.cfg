// CrossSync sample profile. Datos inventados para la demo.
sensitivity "1.6"

// Crosshair
cl_crosshaircolor_r "50"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "160"
cl_crosshairsize "2.5"
cl_crosshairgap "-2"
cl_crosshairthickness "0.5"

// Keybind metadata (se conserva como texto, no se ejecuta)
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "SPACE" "+jump"
bind "SHIFT" "+sprint"
bind "CTRL" "+duck"

// Comandos ajenos al perfil se ignoran
echo "crosssync sample loaded"
